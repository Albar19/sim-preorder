services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim-preorder
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
    networks:
      - app-network

  # Optional: Nginx reverse proxy untuk domain
  nginx:
    image: nginx:alpine
    container_name: sim-preorder-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
