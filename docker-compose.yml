services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: sim-preorder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: simpreorder
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d simpreorder" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim-preorder
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/simpreorder
      - NEXTAUTH_URL=https://sim.mhalbar.tech
      - NEXTAUTH_SECRET=sim-preorder-secret-key-change-in-production
      - NEXTAUTH_TRUST_HOST=true
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # Optional: Nginx reverse proxy untuk domain
  nginx:
    image: nginx:alpine
    container_name: sim-preorder-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - app-network
    profiles:
      - production

volumes:
  postgres-data:
  uploads-data:


networks:
  app-network:
    driver: bridge
